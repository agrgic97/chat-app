server:
  port: 8080

spring:
  application:
    name: chat-app-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatapp}
    username: ${SPRING_DATASOURCE_USERNAME:chatapp}
    password: ${SPRING_DATASOURCE_PASSWORD:chatapp}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-32bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
